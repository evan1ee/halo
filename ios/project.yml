# Source of truth for ios/Halo.xcodeproj (ADR-0017, ADR-0022 step 4).
# Regenerate after editing: `cd ios && xcodegen --spec project.yml --project .`
# The development team is deliberately not set here: pass DEVELOPMENT_TEAM=<id> to xcodebuild or choose it in Xcode.
name: Halo
options:
  bundleIdPrefix: one.mbm
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Beta: Config/Beta.xcconfig
  Release: Config/Release.xcconfig
configs:
  Debug: debug
  Beta: release
  Release: release
packages:
  HaloCore: {path: Packages/HaloCore}
  HaloApple: {path: Packages/HaloApple}
targets:
  Halo:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: HaloCore
        product: HaloFoundation
      - package: HaloCore
        product: HaloDomain
      - package: HaloCore
        product: HaloApplication
      - package: HaloApple
        product: HaloMatrixAdapter
      - package: HaloApple
        product: HaloPlatform
      - package: HaloApple
        product: HaloPersistence
      - package: HaloApple
        product: HaloDesignSystem
      - package: HaloApple
        product: HaloBotRendering
      - package: HaloApple
        product: FeatureOnboarding
      - package: HaloApple
        product: FeatureRoomList
      - package: HaloApple
        product: FeatureTimeline
      - package: HaloApple
        product: FeatureComposer
      - package: HaloApple
        product: FeatureMedia
      - package: HaloApple
        product: FeatureStickers
      - package: HaloApple
        product: FeatureSettings
      - package: HaloApple
        product: FeatureRoomDetails
      - package: HaloApple
        product: FeatureBotActivity
      - package: HaloApple
        product: FeatureSearch
      - package: HaloApple
        product: FeatureProfile
      - target: HaloNotificationService
        embed: true
      - target: HaloShareExtension
        embed: true
      - target: HaloWidgetExtension
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/Support/Halo.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Halo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      configs:
        Debug:
          INFOPLIST_FILE: App/Support/Info-Debug.plist
        Beta:
          INFOPLIST_FILE: App/Support/Info.plist
        Release:
          INFOPLIST_FILE: App/Support/Info.plist
  HaloNotificationService:
    type: app-extension
    platform: iOS
    sources: [NotificationService]
    dependencies:
      - package: HaloCore
        product: HaloFoundation
      - package: HaloCore
        product: HaloDomain
      - package: HaloCore
        product: HaloApplication
      - package: HaloApple
        product: HaloMatrixAdapter
      - package: HaloApple
        product: HaloPersistence
      - package: HaloApple
        product: HaloPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HALO_NSE_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: NotificationService/HaloNotificationService.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Halo Notifications
        INFOPLIST_FILE: NotificationService/Info.plist
  HaloShareExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension]
    dependencies:
      - package: HaloCore
        product: HaloFoundation
      - package: HaloCore
        product: HaloDomain
      - package: HaloCore
        product: HaloApplication
      - package: HaloApple
        product: HaloPlatform
      - package: HaloApple
        product: HaloMatrixAdapter
      - package: HaloApple
        product: FeatureRoomList
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HALO_SHARE_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: ShareExtension/HaloShareExtension.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Halo
        INFOPLIST_FILE: ShareExtension/Info.plist
  HaloWidgetExtension:
    type: app-extension
    platform: iOS
    sources: [WidgetExtension]
    dependencies:
      - package: HaloCore
        product: HaloFoundation
      - package: HaloCore
        product: HaloDomain
      - package: HaloApple
        product: HaloPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HALO_WIDGET_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: WidgetExtension/HaloWidgetExtension.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Halo Widgets
        INFOPLIST_FILE: WidgetExtension/Info.plist
  HaloUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Halo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HALO_APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Halo
schemes:
  Halo-Debug:
    build:
      targets:
        Halo: all
        HaloUITests: [test]
    run: {config: Debug}
    test:
      config: Debug
      targets:
        - HaloUITests
    profile: {config: Release}
    analyze: {config: Debug}
    archive: {config: Release}
