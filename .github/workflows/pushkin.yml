name: pushkin

on:
  pull_request:
    paths:
      - "infra/sygnal/**"
      - ".github/workflows/pushkin.yml"
  push:
    branches: [main]
    paths:
      - "infra/sygnal/**"
      - ".github/workflows/pushkin.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Halo Sygnal pushkin unit tests
        run: python3 -m unittest discover -s infra/sygnal -p "test_*.py" -v
