name: swift-linux
# Linux-buildable core targets (docs/development/CI_CD.md, ADR-0009, ADR-0022 step 4).
on:
  pull_request:
    paths: ["ios/Packages/HaloCore/**", ".github/workflows/swift-linux.yml"]
  push:
    branches: [main]
    paths: ["ios/Packages/HaloCore/**", ".github/workflows/swift-linux.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test HaloCore (warnings as errors)
        run: swift test --package-path ios/Packages/HaloCore -Xswiftc -warnings-as-errors
