name: secrets
# Secret scanning of the full history (SECURITY §7). gitleaks is pinned by version and checksum.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" gitleaks
      - name: Scan history
        run: ./gitleaks git --redact --no-banner .
