# Halo local development homeserver (M0, D64): Synapse with native Matrix password login and native
# sliding sync, backed by Postgres. No MAS until M5; Sygnal is added in M1.
# Local development only — never expose this setup to a network you don't control.
name: halo-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      # Synapse requires the C collation (Synapse docs, "Using Postgres").
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      # No password: Postgres is reachable only on the compose network (no published port).
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "synapse"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Generates homeserver.yaml, the signing key and the random secrets once, into the synapse-data
  # volume (never into the repository). Re-running it is a no-op.
  synapse-init:
    image: matrixdotorg/synapse:${SYNAPSE_VERSION:-v1.165.0}
    environment:
      SYNAPSE_SERVER_NAME: ${HALO_DEV_SERVER_NAME:-halo.localhost}
      SYNAPSE_REPORT_STATS: "no"
    entrypoint: ["/bin/sh", "-c", "[ -f /data/homeserver.yaml ] || exec /start.py generate"]
    volumes:
      - synapse-data:/data

  synapse:
    image: matrixdotorg/synapse:${SYNAPSE_VERSION:-v1.165.0}
    depends_on:
      synapse-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    # The generated config first, then Halo's committed overrides (later files win per top-level key).
    command: ["run", "--config-path", "/data/homeserver.yaml", "--config-path", "/config/homeserver.dev.yaml"]
    volumes:
      - synapse-data:/data
      - ./synapse/homeserver.dev.yaml:/config/homeserver.dev.yaml:ro
    ports:
      # Default: this machine only. Set HALO_DEV_BIND=0.0.0.0 to reach it from a device on your LAN.
      - "${HALO_DEV_BIND:-127.0.0.1}:${HALO_DEV_PORT:-8008}:8008"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8008/health"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  postgres-data:
  synapse-data:
