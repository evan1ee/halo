# The scale fixture's own homeserver (ROADMAP M17-3): a separate project, database and port, so nothing here can touch the shared
# dev server or its contract accounts. Started, filled and removed by infra/dev/scale-fixtures.py. Local development only.
name: halo-scale

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      POSTGRES_HOST_AUTH_METHOD: trust  # reachable only on the compose network
    # The data can be made again: no waiting for the disk on every event.
    command: ["postgres", "-c", "synchronous_commit=off", "-c", "shared_buffers=256MB"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "synapse"]
      interval: 2s
      timeout: 3s
      retries: 30

  synapse-init:
    image: matrixdotorg/synapse:${SYNAPSE_VERSION:-v1.165.0}
    environment:
      SYNAPSE_SERVER_NAME: scale.halo.localhost
      SYNAPSE_REPORT_STATS: "no"
    entrypoint: ["/bin/sh", "-c", "[ -f /data/homeserver.yaml ] || exec /start.py generate"]
    volumes:
      - synapse-data:/data

  synapse:
    image: matrixdotorg/synapse:${SYNAPSE_VERSION:-v1.165.0}
    depends_on:
      synapse-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["run", "--config-path", "/data/homeserver.yaml", "--config-path", "/config/homeserver.dev.yaml", "--config-path", "/config/homeserver.scale.yaml"]
    volumes:
      - synapse-data:/data
      - ./synapse/homeserver.dev.yaml:/config/homeserver.dev.yaml:ro
      - ./synapse/homeserver.scale.yaml:/config/homeserver.scale.yaml:ro
      # Generated by scale-fixtures.py (random tokens), outside the repository.
      - ${HALO_SCALE_DIR:?set by infra/dev/scale-fixtures.py}/appservice.yaml:/config/appservice.yaml:ro
    ports:
      - "${HALO_SCALE_BIND:-127.0.0.1}:${HALO_SCALE_PORT:-8108}:8008"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8008/health"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  postgres-data:
  synapse-data:
