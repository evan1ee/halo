# Throwaway homeserver behind the fault proxy, for the scenario driver in CI and the fault tests on a Mac (ADR-0009, ROADMAP M17-6).
# Nothing is kept: the database is in memory and `down -v` removes the rest. Use infra/test/run.sh. Never expose it to a network.
name: halo-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      POSTGRES_HOST_AUTH_METHOD: trust  # reachable only on the compose network
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "synapse"]
      interval: 1s
      timeout: 3s
      retries: 60

  synapse-init:
    image: matrixdotorg/synapse:${SYNAPSE_VERSION:-v1.165.0}
    environment:
      SYNAPSE_SERVER_NAME: test.halo.localhost
      SYNAPSE_REPORT_STATS: "no"
    entrypoint: ["/bin/sh", "-c", "[ -f /data/homeserver.yaml ] || exec /start.py generate"]
    volumes:
      - synapse-data:/data

  synapse:
    image: matrixdotorg/synapse:${SYNAPSE_VERSION:-v1.165.0}
    depends_on:
      synapse-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["run", "--config-path", "/data/homeserver.yaml", "--config-path", "/config/homeserver.dev.yaml"]
    volumes:
      - synapse-data:/data
      - ../dev/synapse/homeserver.dev.yaml:/config/homeserver.dev.yaml:ro
    ports:
      - "127.0.0.1:${HALO_TEST_PORT:-8208}:8008"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8008/health"]
      interval: 1s
      timeout: 3s
      retries: 90

  proxy:
    image: matrixdotorg/synapse:${SYNAPSE_VERSION:-v1.165.0}  # only for its Python: nothing more to pull
    depends_on:
      synapse:
        condition: service_healthy
    entrypoint: ["python3", "-u", "/fault_proxy.py", "--bind", "0.0.0.0", "--listen", "8118", "--control", "8119", "--upstream", "synapse:8008"]
    volumes:
      - ./fault_proxy.py:/fault_proxy.py:ro
    ports:
      - "127.0.0.1:${HALO_TEST_PROXY_PORT:-8218}:8118"
      - "127.0.0.1:${HALO_TEST_CONTROL_PORT:-8219}:8119"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8119/rules"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  synapse-data:
